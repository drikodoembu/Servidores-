<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Acessos</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">
</head>
<body>

<header>
  <div>
    <h1>Meus Acessos</h1>
    <p>Servidores, sites, painéis e ferramentas</p>
  </div>
</header>

<section class="top-actions">
  <button id="btnNovaCategoria">+ Categoria</button>
</section>

<main id="categoriasContainer"></main>

<!-- Modal Acesso -->
<div id="modalAcesso" class="modal hidden">
  <div class="modal-content">
    <h2 id="tituloModalAcesso">Novo acesso</h2>

    <label>Categoria</label>
    <select id="categoriaAcesso"></select>

    <label>Nome</label>
    <input type="text" id="nome" placeholder="Ex: Login P2SPEED">

    <label>Descrição</label>
    <input type="text" id="descricao" placeholder="Ex: Painel principal">

    <label>Link</label>
    <input type="text" id="url" placeholder="https://...">

    <button id="salvarAcesso" class="btnSalvar">Salvar</button>
    <button id="cancelarAcesso" class="btnCancelar">Cancelar</button>
  </div>
</div>

<!-- Modal Categoria -->
<div id="modalCategoria" class="modal hidden">
  <div class="modal-content">
    <h2>Nova categoria</h2>

    <label>Nome da categoria</label>
    <input type="text" id="nomeCategoria" placeholder="Ex: IPTV, Sites, Bancos, Ferramentas">

    <button id="salvarCategoria" class="btnSalvar">Salvar categoria</button>
    <button id="cancelarCategoria" class="btnCancelar">Cancelar</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
